name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull request that gets three pushes in a minute shouldn't run three times.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        # tuki ships binaries for all three, so all three get tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test (race)
        run: go test -race ./...
      - name: build
        run: go build ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # tuki replaces its own binary when you run `tuki update`, so a known
      # vulnerability in what it's built from is worth failing the build over.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
